<section class="feedback-page"><app-page-header eyebrow="Support" title="Feedback & issue report" description="Report a product issue or feedback with a category and priority so it can be tracked through resolution."></app-page-header><p class="notice error" *ngIf="errorMessage">{{ errorMessage }}</p><p class="notice success" *ngIf="successMessage">{{ successMessage }}</p><app-card><form (ngSubmit)="submit()" #feedbackForm="ngForm"><label>Category<input name="category" maxlength="80" required [(ngModel)]="category"></label><label>Priority<select name="priority" [(ngModel)]="priority"><option *ngFor="let item of priorities" [value]="item">{{ item }}</option></select></label><label class="wide">Subject<input name="subject" maxlength="200" required [(ngModel)]="subject"></label><label class="wide">Description<textarea name="description" maxlength="4000" rows="7" required [(ngModel)]="description"></textarea></label><div class="wide"><app-button type="submit" [loading]="isSaving" [disabled]="feedbackForm.invalid">Submit report</app-button></div></form></app-card></section>
