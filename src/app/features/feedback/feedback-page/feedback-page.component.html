<section class="feedback-page"><app-page-header eyebrow="feedback.eyebrow" title="feedback.title" description="feedback.description"></app-page-header><p class="notice error" *ngIf="errorMessage">{{ errorMessage | translate }}</p><p class="notice success" *ngIf="successMessage">{{ successMessage | translate }}</p><app-card><form (ngSubmit)="submit()" #feedbackForm="ngForm"><label>{{ 'feedback.category' | translate }}<input name="category" maxlength="80" required [(ngModel)]="category"></label><label>{{ 'feedback.priority' | translate }}<select name="priority" [(ngModel)]="priority"><option *ngFor="let item of priorities" [value]="item">{{ item | translate }}</option></select></label><label class="wide">{{ 'feedback.subject' | translate }}<input name="subject" maxlength="200" required [(ngModel)]="subject"></label><label class="wide">{{ 'feedback.descriptionLabel' | translate }}<textarea name="description" maxlength="4000" rows="7" required [(ngModel)]="description"></textarea></label><div class="wide"><app-button type="submit" [loading]="isSaving" [disabled]="feedbackForm.invalid">{{ 'feedback.submit' | translate }}</app-button></div></form></app-card></section>
