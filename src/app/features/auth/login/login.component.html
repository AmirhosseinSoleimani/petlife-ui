<app-auth-layout>
  <div class="heading">
    <h2>{{ 'auth.loginTitle' | translate }}</h2>
    <p>{{ 'auth.loginSubtitle' | translate }}</p>
  </div>
  <form class="auth-form" (ngSubmit)="login()" #loginForm="ngForm">
    <app-input name="email" label="auth.emailOrMobile" type="text"
      placeholder="auth.emailOrMobilePlaceholder" required
      [(ngModel)]="credentials.email"></app-input>
    <app-input name="password" label="auth.password" type="password"
      placeholder="auth.passwordPlaceholder" required
      [(ngModel)]="credentials.password"></app-input>
    <div class="form-links"><a routerLink="/forgot-password">{{ 'auth.forgotPassword' | translate }}</a></div>
    <p *ngIf="errorMessage" class="error" role="alert">{{ errorMessage | translate }}</p>
    <div class="form-actions">
      <app-button type="submit" [loading]="isSubmitting" [disabled]="loginForm.invalid || isSubmitting">
        {{ (isSubmitting ? 'auth.signingIn' : 'auth.signIn') | translate }}
      </app-button>
    </div>
  </form>
  <p class="footer-copy">
    {{ 'auth.newToPetLife' | translate }}
    <a routerLink="/register/customer">{{ 'auth.createAccount' | translate }}</a>
  </p>
</app-auth-layout>
