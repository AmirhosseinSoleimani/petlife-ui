<div *ngIf="open" class="modal-backdrop" (mousedown)="onBackdropClick($event)">
  <section
    #dialog
    class="modal-panel"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-label]="title | translate"
  >
    <header class="modal-header">
      <div>
        <h2>{{ title | translate }}</h2>
        <p *ngIf="description">{{ description | translate }}</p>
      </div>
      <button type="button" class="modal-close" [attr.aria-label]="'common.close' | translate" (click)="requestClose()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"></path>
        </svg>
      </button>
    </header>
    <div class="modal-body">
      <ng-content></ng-content>
    </div>
  </section>
</div>
