<label class="field" [class.checkbox]="isCheckbox">
  <span *ngIf="label">{{ label | translate }}</span>

  <input
    *ngIf="isCheckbox"
    type="checkbox"
    [required]="isRequired"
    [disabled]="isDisabled"
    [checked]="!!value"
    (change)="updateValue($any($event.target).checked)"
    (blur)="markTouched()"
  />

  <textarea
    *ngIf="isTextarea && !isCheckbox"
    [rows]="rows"
    [placeholder]="placeholder | translate"
    [required]="isRequired"
    [disabled]="isDisabled"
    [ngModel]="value"
    (ngModelChange)="updateValue($event)"
    (blur)="markTouched()"
  ></textarea>

  <select
    *ngIf="isSelect && !isCheckbox"
    [required]="isRequired"
    [disabled]="isDisabled"
    [ngModel]="value"
    (ngModelChange)="updateValue($event)"
    (blur)="markTouched()"
  >
    <option [ngValue]="placeholderValue">{{ (placeholder || 'Select an option') | translate }}</option>
    <option *ngFor="let option of normalizedOptions" [ngValue]="option.value">{{ option.label | translate }}</option>
  </select>

  <div *ngIf="isPasswordToggleEnabled" class="input-control password-control">
    <input
      #passwordInput
      [type]="resolvedPasswordType"
      [placeholder]="placeholder | translate"
      [required]="isRequired"
      [disabled]="isDisabled"
      [ngModel]="value"
      (ngModelChange)="updateValue($event)"
      (blur)="markTouched()"
    />
    <button
      type="button"
      class="password-toggle"
      [disabled]="isDisabled"
      [attr.aria-label]="(passwordVisible ? 'auth.hidePassword' : 'auth.showPassword') | translate"
      [attr.aria-pressed]="passwordVisible"
      (mousedown)="preventPasswordToggleMouseDown($event)"
      (click)="togglePasswordVisibility()"
    >
      <svg *ngIf="!passwordVisible" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
        <circle cx="12" cy="12" r="2.75" />
      </svg>
      <svg *ngIf="passwordVisible" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c6 0 9.5 6 9.5 6a15.9 15.9 0 0 1-3 3.7M6.3 6.3C3.9 8 2.5 12 2.5 12s3.5 6 9.5 6c1.5 0 2.8-.4 4-1M9.9 9.9a3 3 0 0 0 4.2 4.2" />
      </svg>
    </button>
  </div>

  <input
    *ngIf="!isTextarea && !isSelect && !isCheckbox && !isPasswordToggleEnabled"
    [type]="type"
    [placeholder]="placeholder | translate"
    [required]="isRequired"
    [disabled]="isDisabled"
    [min]="min"
    [max]="max"
    [step]="step"
    [ngModel]="value"
    (ngModelChange)="updateValue($event)"
    (blur)="markTouched()"
  />

  <small *ngIf="helper && !error">{{ helper | translate }}</small>
  <small *ngIf="error" class="error-text">{{ error | translate }}</small>
</label>
